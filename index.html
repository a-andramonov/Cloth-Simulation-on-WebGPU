<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Модель ткани</title>
    <style>
        #ui {
    position: absolute;
    top: 20px;
    left: 20px;
    background: rgba(255, 255, 255, 0.8);
    padding: 10px 15px;
    border-radius: 5px;
    z-index: 10;
}
    </style>
</head>
<body style="margin:0; background:#222; overflow:hidden;">
    <canvas id="webgpu-canvas"></canvas>
    <label id="ui">
        <input type="checkbox" id="gravityToggle"> Включить гравитацию
        <input type="range" id="freqSlider" min="0" max="5" step="0.1" value="5"> Частота 
        <input type="range" id="ampSlider" min="0" max="5" step="0.1" value="5"> Амплитуда
    </label>
    <script type="module" src="main.js"></script>
</body>
</html>
